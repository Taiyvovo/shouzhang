  <!-- 右眼泪滴 -->
  <ellipse cx="132" cy="105" rx="4" ry="8" fill="#7aadd8" opacity="0.8"/>
  <path d="M 132 97 Q 128 105 132 113 Q 136 105 132 97" fill="#7aadd8" opacity="0.8"/>
